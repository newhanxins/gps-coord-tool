<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS坐标定位工具</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif; background: #f0f2f5; overflow: hidden; }
        .container { display: flex; height: 100vh; }

        /* 左侧侧边栏 */
        .sidebar { width: 420px; min-width: 400px; background: #fff; border-right: 1px solid #e8e8e8; display: flex; flex-direction: column; overflow: hidden; box-shadow: 2px 0 8px rgba(0,0,0,0.06); }
        .sidebar-header { padding: 16px 20px; background: linear-gradient(135deg, #1890ff 0%, #36cfcf 100%); color: white; flex-shrink: 0; }
        .sidebar-header h1 { font-size: 16px; margin-bottom: 2px; font-weight: 600; }
        .sidebar-header p { font-size: 11px; opacity: 0.9; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; }
        .sidebar-footer { padding: 12px 20px 16px; border-top: 1px solid #f0f0f0; background: #fff; flex-shrink: 0; }

        /* 表单元素 */
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; color: #333; font-weight: 600; margin-bottom: 6px; }
        .form-label .tip { font-weight: normal; color: #999; font-size: 11px; margin-left: 4px; }
        .form-select { width: 100%; padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; background: #fff; cursor: pointer; }
        .form-select:focus { outline: none; border-color: #1890ff; }
        .form-textarea { width: 100%; padding: 8px 10px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 13px; font-family: 'Consolas', monospace; resize: vertical; min-height: 80px; }
        .form-textarea:focus { outline: none; border-color: #1890ff; }

        /* Tab 切换 */
        .tab-nav { display: flex; border-bottom: 1px solid #e8e8e8; margin-bottom: 14px; }
        .tab-nav-item { flex: 1; padding: 8px 0; text-align: center; font-size: 13px; color: #666; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .tab-nav-item.active { color: #1890ff; border-bottom-color: #1890ff; font-weight: 600; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 单点输入 */
        .point-inputs { margin-bottom: 10px; }
        .point-input-item { padding: 10px; margin-bottom: 10px; border: 1px solid #e8e8e8; border-radius: 8px; background: #fafafa; }
        .point-input-item .point-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .point-input-item .point-badge { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: bold; }
        .point-input-item .point-row { display: flex; gap: 8px; }
        .point-input-item .point-row .input-group { flex: 1; }
        .point-input-item .point-row .input-group label { display: block; font-size: 11px; color: #666; margin-bottom: 2px; }
        .point-input-item .point-row .input-group input { width: 100%; padding: 6px 8px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 12px; font-family: 'Consolas', monospace; }
        .point-input-item .point-row .input-group input:focus { outline: none; border-color: #1890ff; }
        .btn-remove { background: #ff4d4f; color: white; border: none; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
        .btn-remove:hover { opacity: 0.8; }
        .btn-add { width: 100%; padding: 8px; background: #f0f2f5; border: 1px dashed #d9d9d9; border-radius: 6px; color: #1890ff; font-size: 13px; cursor: pointer; text-align: center; transition: all 0.3s; }
        .btn-add:hover { background: #e6f7ff; border-color: #1890ff; }

        /* 坐标转换结果 */
        .convert-result { margin-top: 10px; border: 1px solid #e8e8e8; border-radius: 8px; overflow: hidden; }
        .convert-header { padding: 8px 12px; background: #f5f5f5; font-size: 12px; font-weight: 600; color: #333; border-bottom: 1px solid #e8e8e8; }
        .convert-item { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .convert-item:last-child { border-bottom: none; }
        .convert-item-label { font-size: 12px; color: #666; }
        .convert-item-value { font-size: 12px; font-family: 'Consolas', monospace; color: #1890ff; }
        .btn-copy { padding: 2px 8px; font-size: 11px; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; cursor: pointer; color: #666; margin-left: 6px; }
        .btn-copy:hover { border-color: #1890ff; color: #1890ff; }

        /* 开关 */
        .switch-group { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .switch-label { font-size: 12px; color: #333; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        .switch input:checked + .slider { background-color: #1890ff; }
        .switch input:checked + .slider:before { transform: translateX(22px); }

        /* 按钮 */
        .btn-primary { width: 100%; padding: 10px; background: linear-gradient(135deg, #1890ff 0%, #36cfcf 100%); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; letter-spacing: 1px; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:active { transform: scale(0.98); }

        /* 右侧地图 */
        .map-container { flex: 1; position: relative; min-width: 0; }
        #map { width: 100%; height: 100%; }

        /* 地图标记 */
        .custom-marker { width: 28px; height: 28px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 2px solid #fff; }
        .custom-marker span { transform: rotate(45deg); }
        .long-press-marker { width: 20px; height: 20px; border-radius: 50%; background: #ff5722; border: 3px solid #fff; box-shadow: 0 2px 8px rgba(255,87,34,0.4); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

        /* Leaflet 弹窗 */
        .leaflet-popup-content { margin: 10px 14px; line-height: 1.8; font-size: 12px; }
        .popup-title { font-weight: 600; font-size: 13px; color: #333; margin-bottom: 6px; padding-bottom: 4px; border-bottom: 1px solid #f0f0f0; }
        .popup-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
        .popup-label { color: #666; }
        .popup-value { color: #1890ff; font-family: 'Consolas', monospace; }

        /* 图层切换 */
        .leaflet-control-layers { 
            border-radius: 8px !important; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important; 
            font-family: 'Microsoft YaHei', sans-serif; 
            font-size: 12px;
            background: white !important;
            border: 2px solid rgba(0,0,0,0.2) !important;
        }
        .leaflet-control-layers-selector {
            margin-right: 6px;
        }
        .leaflet-control-layers label {
            display: flex;
            align-items: center;
            padding: 4px 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .leaflet-control-layers label:hover {
            background: #f0f2f5;
            border-radius: 4px;
        }

        /* Toast */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 9999; transition: all 0.3s; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>GPS 坐标定位工具</h1>
                <p>支持 WGS-84 / GCJ-02 / BD-09 坐标转换</p>
            </div>
            <div class="sidebar-content">
                <!-- 坐标类型选择 -->
                <div class="form-group">
                    <label class="form-label">输入坐标类型</label>
                    <select class="form-select" id="coordType">
                        <option value="wgs84">WGS-84 (GPS)</option>
                        <option value="gcj02">GCJ-02 (高德/腾讯)</option>
                        <option value="bd09">BD-09 (百度)</option>
                    </select>
                </div>

                <!-- 地图类型选择 -->
                <div class="form-group">
                    <label class="form-label">地图类型</label>
                    <select class="form-select" id="mapType">
                        <option value="gcj02">高德地图 (GCJ-02)</option>
                        <option value="bd09">百度地图 (BD-09)</option>
                        <option value="google">Google Maps (WGS-84)</option>
                        <option value="wgs84">OpenStreetMap (WGS-84)</option>
                    </select>
                </div>

                <!-- Tab 切换 -->
                <div class="tab-nav">
                    <div class="tab-nav-item active" data-tab="single">单点输入</div>
                    <div class="tab-nav-item" data-tab="batch">批量输入</div>
                </div>

                <!-- 单点输入 -->
                <div class="tab-content active" id="tabSingle">
                    <div class="point-inputs" id="pointInputs"></div>
                    <button class="btn-add" id="addPointBtn">+ 添加点</button>
                </div>

                <!-- 批量输入 -->
                <div class="tab-content" id="tabBatch">
                    <div class="form-group">
                        <label class="form-label">批量输入坐标 <span class="tip">每行格式: 经度,纬度</span></label>
                        <textarea class="form-textarea" id="batchInput" placeholder="104.0648,30.6573
104.0819,30.6572"></textarea>
                    </div>
                </div>

                <!-- 坐标转换结果 -->
                <div class="convert-result" id="convertResult">
                    <div class="convert-header">坐标转换结果</div>
                    <div id="convertResultBody"></div>
                </div>

                <!-- 偏移计算开关 -->
                <div class="switch-group" style="margin-top: 14px;">
                    <span class="switch-label">坐标偏移计算</span>
                    <label class="switch">
                        <input type="checkbox" id="offsetSwitch" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="sidebar-footer">
                <button class="btn-primary" id="updateBtn">更新位置</button>
            </div>
        </div>

        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="leaflet.js"></script>
    <script src="main.js"></script>
</body>
</html>
